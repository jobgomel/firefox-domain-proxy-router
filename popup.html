<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 16px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h3 { margin: 0; font-size: 15px; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #2196F3; }
    input:checked + .slider:before { transform: translateX(18px); }
    label { display: block; margin-top: 10px; font-size: 12px; font-weight: bold; }
    input, textarea { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    textarea { height: 80px; font-family: monospace; }
    button { margin-top: 12px; width: 100%; padding: 8px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1976D2; }
    #msg { margin-top: 8px; font-size: 12px; color: green; text-align: center; min-height: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h3>🌐 Proxy Router</h3>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <label>Адрес прокси:</label>
  <input type="text" id="proxyAddr" placeholder="127.0.0.1:8080">

  <label>Домены (каждый с новой строки):</label>
  <textarea id="domains" placeholder="example.com&#10;*.test.org"></textarea>

  <button id="save">💾 Сохранить</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
