<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../global.css">
    <style>
        /* ==========================================
           POPUP — специфичные стили (340px)
           ========================================== */
        body {
            width: 340px;
            margin: 0;
            padding: 16px;
            font-family: var(--font-sans);
            background-color: var(--canvas);
            color: var(--ink);
            line-height: 1.5;
        }

        /* ==========================================
           HEADER
           ========================================== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            color: var(--ink);
        }

        .subtitle {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.01em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ==========================================
           SETTINGS BUTTON (icon only)
           ========================================== */
        .btn-settings {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            padding: 0;
            background: transparent;
            border: none;
            color: var(--muted);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-settings:hover {
            color: var(--ink);
            background-color: var(--elevated);
        }

        .btn-settings:active {
            transform: scale(0.92);
        }

        .btn-settings .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }

        /* ==========================================
           STATUS CARD
           ========================================== */
        .status-card {
            background-color: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 12px;
            text-align: center;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .status-card.active {
            border-color: var(--success);
        }

        .status-icon-wrap {
            width: 56px;
            height: 56px;
            margin: 0 auto 12px;
            background-image: url("../../icons/icon-default.png");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.2s ease, opacity 0.2s ease;
            opacity: 0.45;
        }

        .status-card.active .status-icon-wrap {
            opacity: 1;
        }

        .status-icon-wrap.disable {
            background-image: url("../../icons/icon-disable.png");
        }

        .status-text {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 4px;
            letter-spacing: -0.01em;
            color: var(--ink);
        }

        .status-card.active .status-text {
            color: var(--success);
        }

        .status-card:not(.active) .status-text {
            color: var(--danger);
        }

        .status-desc {
            font-size: 12px;
            color: var(--body);
            margin: 0;
            line-height: 1.5;
        }

        /* ==========================================
           ROUTING MODE SELECTOR
           ========================================== */
        .control-group {
            background-color: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            margin-bottom: 0;
        }

        .control-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 10px;
        }

        /* Custom select */
        .select-wrapper {
            position: relative;
        }

        .select-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 9px 32px 9px 12px;
            border: 1px solid var(--hairline);
            border-radius: var(--radius-md);
            background-color: var(--elevated);
            color: var(--ink);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            font-family: inherit;
            line-height: 1.5;
        }

        .select-trigger:hover {
            border-color: var(--ink);
        }

        .select-trigger:focus-visible {
            outline: none;
            border-color: var(--hairline-focus);
            box-shadow: 0 0 0 3px rgba(13, 116, 206, 0.12);
        }

        .select-trigger-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            color: var(--body);
        }

        .select-trigger-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Dropdown chevron */
        .select-wrapper::after {
            content: "";
            position: absolute;
            right: 12px;
            top: 50%;
            width: 7px;
            height: 7px;
            border-right: 1.5px solid var(--muted);
            border-bottom: 1.5px solid var(--muted);
            pointer-events: none;
            transform: translateY(-70%) rotate(45deg);
            transition: transform 0.2s ease;
        }

        .select-wrapper.open::after {
            transform: translateY(-20%) rotate(-135deg);
        }

        .select-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 100;
            margin: 0;
            padding: 4px;
            list-style: none;
            background-color: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .select-wrapper.open .select-dropdown {
            display: block;
        }

        .select-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: background-color 0.1s ease;
        }

        .select-option:hover {
            background-color: var(--elevated);
        }

        .select-option.selected {
            background-color: var(--elevated);
            font-weight: 600;
        }

        .select-option-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            color: var(--muted);
        }

        .select-option.selected .select-option-icon {
            color: var(--ink);
        }

        .mode-desc {
            font-size: 12px;
            color: var(--body);
            line-height: 1.5;
            margin-top: 10px;
        }

        /* ==========================================
           UTILITY
           ========================================== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand-text">
            <span class="title" data-i18n="extensionName">Proxy router</span>
            <span class="subtitle">Firefox Extension</span>
        </div>
        <div class="header-actions">
            <button id="open-settings" class="btn-settings" title="Настройки проксирования">
                <span class="btn-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">

                    </svg>
                </span>
            </button>
            <label class="switch" title="Включить / выключить">
                <input type="checkbox" id="global-toggle">
                <span class="slider"></span>
                <span class="sr-only">Глобальный переключатель</span>
            </label>
        </div>
    </header>

    <main>
        <section class="status-card" id="status-card">
            <div class="status-icon-wrap" id="status-icon" aria-hidden="true"></div>
            <h2 class="status-text" id="status-label">Защита активна</h2>
            <p class="status-desc" id="status-details">Трафик маршрутизируется согласно правилам</p>
        </section>

        <section class="control-group">
            <label for="routing-mode-trigger" class="control-label">Режим маршрутизации</label>
            <div class="select-wrapper" id="routing-mode-wrapper">
                <button class="select-trigger" id="routing-mode-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span class="select-trigger-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m7.5-6.923c-.67.204-1.335.82-1.887 1.855q-.215.403-.395.872c.705.157 1.472.257 2.282.287zM4.249 3.539q.214-.577.481-1.078a7 7 0 0 1 .597-.933A7 7 0 0 0 3.051 3.05q.544.277 1.198.49zM3.509 7.5c.036-1.07.188-2.087.436-3.008a9 9 0 0 1-1.565-.667A6.96 6.96 0 0 0 1.018 7.5zm1.4-2.741a12.3 12.3 0 0 0-.4 2.741H7.5V5.091c-.91-.03-1.783-.145-2.591-.332M8.5 5.09V7.5h2.99a12.3 12.3 0 0 0-.399-2.741c-.808.187-1.681.301-2.591.332zM4.51 8.5c.035.987.176 1.914.399 2.741A13.6 13.6 0 0 1 7.5 10.91V8.5zm3.99 0v2.409c.91.03 1.783.145 2.591.332.223-.827.364-1.754.4-2.741zm-3.282 3.696q.18.469.395.872c.552 1.035 1.218 1.65 1.887 1.855V11.91c-.81.03-1.577.13-2.282.287zm.11 2.276a7 7 0 0 1-.598-.933 9 9 0 0 1-.481-1.079 8.4 8.4 0 0 0-1.198.49 7 7 0 0 0 2.276 1.522zm-1.383-2.964A13.4 13.4 0 0 1 3.508 8.5h-2.49a6.96 6.96 0 0 0 1.362 3.675c.47-.258.995-.482 1.565-.667m6.728 2.964a7 7 0 0 0 2.275-1.521 8.4 8.4 0 0 0-1.197-.49 9 9 0 0 1-.481 1.078 7 7 0 0 1-.597.933M8.5 11.909v3.014c.67-.204 1.335-.82 1.887-1.855q.216-.403.395-.872A12.6 12.6 0 0 0 8.5 11.91zm3.555-.401c.57.185 1.095.409 1.565.667A6.96 6.96 0 0 0 14.982 8.5h-2.49a13.4 13.4 0 0 1-.437 3.008M14.982 7.5a6.96 6.96 0 0 0-1.362-3.675c-.47.258-.995.482-1.565.667.248.92.4 1.938.437 3.008zM11.27 2.461q.266.502.482 1.078a8.4 8.4 0 0 0 1.196-.49 7 7 0 0 0-2.275-1.52c.218.283.418.597.597.932m-.488 1.343a8 8 0 0 0-.395-.872C9.835 1.897 9.17 1.282 8.5 1.077V4.09c.81-.03 1.577-.13 2.282-.287z"/>
                        </svg>
                    </span>
                    <span class="select-trigger-text" id="routing-mode-text">Глобальный (все запросы)</span>
                </button>
                <ul class="select-dropdown" id="routing-mode-dropdown" role="listbox" aria-label="Режим маршрутизации">
                    <li role="option" data-value="global" aria-selected="true" class="select-option selected">
                        <span class="select-option-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                              <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m7.5-6.923c-.67.204-1.335.82-1.887 1.855q-.215.403-.395.872c.705.157 1.472.257 2.282.287zM4.249 3.539q.214-.577.481-1.078a7 7 0 0 1 .597-.933A7 7 0 0 0 3.051 3.05q.544.277 1.198.49zM3.509 7.5c.036-1.07.188-2.087.436-3.008a9 9 0 0 1-1.565-.667A6.96 6.96 0 0 0 1.018 7.5zm1.4-2.741a12.3 12.3 0 0 0-.4 2.741H7.5V5.091c-.91-.03-1.783-.145-2.591-.332M8.5 5.09V7.5h2.99a12.3 12.3 0 0 0-.399-2.741c-.808.187-1.681.301-2.591.332zM4.51 8.5c.035.987.176 1.914.399 2.741A13.6 13.6 0 0 1 7.5 10.91V8.5zm3.99 0v2.409c.91.03 1.783.145 2.591.332.223-.827.364-1.754.4-2.741zm-3.282 3.696q.18.469.395.872c.552 1.035 1.218 1.65 1.887 1.855V11.91c-.81.03-1.577.13-2.282.287zm.11 2.276a7 7 0 0 1-.598-.933 9 9 0 0 1-.481-1.079 8.4 8.4 0 0 0-1.198.49 7 7 0 0 0 2.276 1.522zm-1.383-2.964A13.4 13.4 0 0 1 3.508 8.5h-2.49a6.96 6.96 0 0 0 1.362 3.675c.47-.258.995-.482 1.565-.667m6.728 2.964a7 7 0 0 0 2.275-1.521 8.4 8.4 0 0 0-1.197-.49 9 9 0 0 1-.481 1.078 7 7 0 0 1-.597.933M8.5 11.909v3.014c.67-.204 1.335-.82 1.887-1.855q.216-.403.395-.872A12.6 12.6 0 0 0 8.5 11.91zm3.555-.401c.57.185 1.095.409 1.565.667A6.96 6.96 0 0 0 14.982 8.5h-2.49a13.4 13.4 0 0 1-.437 3.008M14.982 7.5a6.96 6.96 0 0 0-1.362-3.675c-.47.258-.995.482-1.565.667.248.92.4 1.938.437 3.008zM11.27 2.461q.266.502.482 1.078a8.4 8.4 0 0 0 1.196-.49 7 7 0 0 0-2.275-1.52c.218.283.418.597.597.932m-.488 1.343a8 8 0 0 0-.395-.872C9.835 1.897 9.17 1.282 8.5 1.077V4.09c.81-.03 1.577-.13 2.282-.287z"/>
                            </svg>
                        </span>
                        <span>Глобальный (все запросы)</span>
                    </li>
                    <li role="option" data-value="tab" aria-selected="false" class="select-option">
                        <span class="select-option-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5zM2.5 3a.5.5 0 0 0-.5.5V6h12v-.5a.5.5 0 0 0-.5-.5H9c-.964 0-1.71-.629-2.174-1.154C6.374 3.334 5.82 3 5.264 3zM14 7H2v5.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5z"/>
                            </svg>

                    </li>
                </ul>
            </div>
            <p class="mode-desc" id="mode-desc"></p>
        </section>
    </main>

    <script type="module" src="popup.js"></script>
</body>
</html>
