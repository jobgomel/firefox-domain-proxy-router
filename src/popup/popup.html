<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../global.css">
    <style>
        /* ==========================================
           THEME VARIABLES
           ========================================== */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-elevated: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0f172a;
                --bg-card: #1e293b;
                --bg-elevated: #334155;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border: #334155;
                --primary: #818cf8;
                --primary-hover: #6366f1;
            }
        }

        body.dark {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-elevated: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #818cf8;
            --primary-hover: #6366f1;
        }

        /* ==========================================
           BASE
           ========================================== */
        body {
            width: 340px;
            margin: 0;
            padding: 18px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            box-sizing: border-box;
        }

        * {
            box-sizing: border-box;
        }

        /* ==========================================
           HEADER
           ========================================== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
            border-radius: var(--radius-lg);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.25;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ==========================================
           TOGGLE SWITCH
           ========================================== */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: var(--border);
            transition: 0.25s ease;
            border-radius: 34px;
            box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.25s cubic-bezier(0.4, 0.0, 0.2, 1);
            border-radius: 50%;
            box-shadow: var(--shadow-sm);
        }

        input:checked + .slider {
            background: linear-gradient(135deg, var(--success) 0%, #34d399 100%);
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }

        input:focus-visible + .slider {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* ==========================================
           STATUS CARD
           ========================================== */
        .status-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .status-icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            background-image: url("../../icons/icon-default.png");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
            border-radius: 50%;
            transition: background-image 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .status-icon-wrap.disable {
            background-image: url("../../icons/icon-disable.png");
        }

        .status-card.active .status-icon-wrap {
            border-color: rgba(16, 185, 129, 0.35);
            transform: scale(1.075);
        }

        .status-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 6px;
            letter-spacing: -0.01em;
        }

        .status-card.active .status-text {
            color: var(--success);
        }

        .status-card:not(.active) .status-text {
            color: var(--danger);
        }

        .status-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        /* ==========================================
           ROUTING MODE
           ========================================== */
        .control-group {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .control-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
        }

        .select-wrapper {
            position: relative;
        }

        .select-trigger {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 11px 34px 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background-color: var(--bg-elevated);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: inherit;
            line-height: 1.5;
        }

        .select-trigger:hover {
            border-color: var(--primary);
        }

        .select-trigger:focus-visible {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .select-trigger-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            color: var(--primary);
        }

        .select-trigger-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .select-wrapper::after {
            content: "";
            position: absolute;
            right: 14px;
            top: 50%;
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--text-muted);
            border-bottom: 2px solid var(--text-muted);
            pointer-events: none;
            transform: translateY(-75%) rotate(45deg);
            transition: transform 0.2s ease;
        }

        .select-wrapper.open::after {
            transform: translateY(-25%) rotate(-135deg);
        }

        .select-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 100;
            margin: 0;
            padding: 4px;
            list-style: none;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .select-wrapper.open .select-dropdown {
            display: block;
        }

        .select-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .select-option:hover {
            background-color: var(--bg-elevated);
        }

        .select-option.selected {
            background-color: var(--bg-elevated);
            color: var(--primary);
        }

        .select-option-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            color: var(--text-muted);
        }

        .select-option.selected .select-option-icon {
            color: var(--primary);
        }

        .mode-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-top: 10px;
        }

        /* ==========================================
           SETTINGS BUTTON
           ========================================== */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-settings {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-settings:hover {
            color: var(--text-main);
            background-color: var(--bg-elevated);
        }

        .btn-settings:active {
            transform: scale(0.92);
        }

        .btn-settings .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
        }

        /* ==========================================
           MICRO UTILITY
           ========================================== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand">
            <div class="brand-text">
                <span class="title" data-i18n="extensionName">Proxy Router Manager</span>
                <span class="subtitle">Быстрый доступ к прокси</span>
            </div>
        </div>
        <div class="header-actions">
        <button id="open-settings" class="btn-settings" title="Настройки проксирования">
            <span class="btn-icon" aria-hidden="true">

                </svg>
            </span>
        </button>
        <label class="switch" title="Включить / выключить">
            <input type="checkbox" id="global-toggle">
            <span class="slider"></span>
            <span class="sr-only">Глобальный переключатель</span>
        </label>
        </div>
    </header>

    <main>
        <section class="status-card" id="status-card">
            <div class="status-icon-wrap" id="status-icon" aria-hidden="true"></div>
            <h2 class="status-text" id="status-label">Защита активна</h2>
            <p class="status-desc" id="status-details">Трафик маршрутизируется согласно правилам</p>
        </section>

        <section class="control-group">
            <label for="routing-mode-trigger" class="control-label">Режим маршрутизации</label>
            <div class="select-wrapper" id="routing-mode-wrapper">
                <button class="select-trigger" id="routing-mode-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span class="select-trigger-icon" aria-hidden="true">

                        </svg>
                    </span>
                    <span class="select-trigger-text" id="routing-mode-text">Глобальный (все запросы)</span>
                </button>
                <ul class="select-dropdown" id="routing-mode-dropdown" role="listbox" aria-label="Режим маршрутизации">
                    <li role="option" data-value="global" aria-selected="true" class="select-option selected">
                        <span class="select-option-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                              <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m7.5-6.923c-.67.204-1.335.82-1.887 1.855q-.215.403-.395.872c.705.157 1.472.257 2.282.287zM4.249 3.539q.214-.577.481-1.078a7 7 0 0 1 .597-.933A7 7 0 0 0 3.051 3.05q.544.277 1.198.49zM3.509 7.5c.036-1.07.188-2.087.436-3.008a9 9 0 0 1-1.565-.667A6.96 6.96 0 0 0 1.018 7.5zm1.4-2.741a12.3 12.3 0 0 0-.4 2.741H7.5V5.091c-.91-.03-1.783-.145-2.591-.332M8.5 5.09V7.5h2.99a12.3 12.3 0 0 0-.399-2.741c-.808.187-1.681.301-2.591.332zM4.51 8.5c.035.987.176 1.914.399 2.741A13.6 13.6 0 0 1 7.5 10.91V8.5zm3.99 0v2.409c.91.03 1.783.145 2.591.332.223-.827.364-1.754.4-2.741zm-3.282 3.696q.18.469.395.872c.552 1.035 1.218 1.65 1.887 1.855V11.91c-.81.03-1.577.13-2.282.287zm.11 2.276a7 7 0 0 1-.598-.933 9 9 0 0 1-.481-1.079 8.4 8.4 0 0 0-1.198.49 7 7 0 0 0 2.276 1.522zm-1.383-2.964A13.4 13.4 0 0 1 3.508 8.5h-2.49a6.96 6.96 0 0 0 1.362 3.675c.47-.258.995-.482 1.565-.667m6.728 2.964a7 7 0 0 0 2.275-1.521 8.4 8.4 0 0 0-1.197-.49 9 9 0 0 1-.481 1.078 7 7 0 0 1-.597.933M8.5 11.909v3.014c.67-.204 1.335-.82 1.887-1.855q.216-.403.395-.872A12.6 12.6 0 0 0 8.5 11.91zm3.555-.401c.57.185 1.095.409 1.565.667A6.96 6.96 0 0 0 14.982 8.5h-2.49a13.4 13.4 0 0 1-.437 3.008M14.982 7.5a6.96 6.96 0 0 0-1.362-3.675c-.47.258-.995.482-1.565.667.248.92.4 1.938.437 3.008zM11.27 2.461q.266.502.482 1.078a8.4 8.4 0 0 0 1.196-.49 7 7 0 0 0-2.275-1.52c.218.283.418.597.597.932m-.488 1.343a8 8 0 0 0-.395-.872C9.835 1.897 9.17 1.282 8.5 1.077V4.09c.81-.03 1.577-.13 2.282-.287z"/>
                            </svg>
                        </span>
                        <span>Глобальный (все запросы)</span>
                    </li>
                    <li role="option" data-value="tab" aria-selected="false" class="select-option">
                        <span class="select-option-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5zM2.5 3a.5.5 0 0 0-.5.5V6h12v-.5a.5.5 0 0 0-.5-.5H9c-.964 0-1.71-.629-2.174-1.154C6.374 3.334 5.82 3 5.264 3zM14 7H2v5.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5z"/>

                </ul>
            </div>
            <p class="mode-desc" id="mode-desc"></p>
        </section>
    </main>

    <script src="popup.js"></script>
</body>
</html>
