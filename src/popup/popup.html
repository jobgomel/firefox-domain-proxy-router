<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../global.css">
    <style>
        /* ==========================================
           THEME VARIABLES
           ========================================== */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-elevated: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0f172a;
                --bg-card: #1e293b;
                --bg-elevated: #334155;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border: #334155;
                --primary: #818cf8;
                --primary-hover: #6366f1;
            }
        }

        body.dark {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-elevated: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #818cf8;
            --primary-hover: #6366f1;
        }

        /* ==========================================
           BASE
           ========================================== */
        body {
            width: 340px;
            margin: 0;
            padding: 18px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            box-sizing: border-box;
        }

        * {
            box-sizing: border-box;
        }

        /* ==========================================
           HEADER
           ========================================== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
            border-radius: var(--radius-lg);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.25;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ==========================================
           TOGGLE SWITCH
           ========================================== */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: var(--border);
            transition: 0.25s ease;
            border-radius: 34px;
            box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.25s cubic-bezier(0.4, 0.0, 0.2, 1);
            border-radius: 50%;
            box-shadow: var(--shadow-sm);
        }

        input:checked + .slider {
            background: linear-gradient(135deg, var(--success) 0%, #34d399 100%);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        input:focus-visible + .slider {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* ==========================================
           STATUS CARD
           ========================================== */
        .status-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .status-icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            background-image: url("../../icons/icon-default.png");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
            border-radius: 50%;
            transition: background-image 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .status-icon-wrap.disable {
            background-image: url("../../icons/icon-disable.png");
        }

        .status-card.active .status-icon-wrap {
            border-color: rgba(16, 185, 129, 0.35);
            transform: scale(1.075);
        }

        .status-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 6px;
            letter-spacing: -0.01em;
        }

        .status-card.active .status-text {
            color: var(--success);
        }

        .status-card:not(.active) .status-text {
            color: var(--danger);
        }

        .status-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        /* ==========================================
           ROUTING MODE
           ========================================== */
        .control-group {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .control-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: "";
            position: absolute;
            right: 14px;
            top: 50%;
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--text-muted);
            border-bottom: 2px solid var(--text-muted);
            pointer-events: none;
            transform: translateY(-75%) rotate(45deg);
        }

        select {
            width: 100%;
            padding: 11px 34px 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background-color: var(--bg-elevated);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            appearance: none;
            -moz-appearance: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        select:hover {
            border-color: var(--primary);
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .mode-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-top: 10px;
        }

        /* ==========================================
           SETTINGS BUTTON
           ========================================== */
        .btn-settings {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 13px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: var(--radius-lg);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .btn-settings:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .btn-settings:active {
            transform: translateY(0);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background-color: var(--bg-elevated);
            font-size: 0.95rem;
        }

        .btn-arrow {
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--text-muted);
            border-top: 2px solid var(--text-muted);
            transform: rotate(45deg);
            transition: transform 0.2s ease;
        }

        .btn-settings:hover .btn-arrow {
            transform: rotate(45deg) translate(2px, -2px);
        }

        /* ==========================================
           MICRO UTILITY
           ========================================== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand">
            <!--div class="logo-icon" aria-hidden="true">🔀</div-->
            <div class="brand-text">
                <span class="title" data-i18n="extensionName">Proxy Router Manager</span>
                <span class="subtitle">Быстрый доступ к прокси</span>
            </div>
        </div>
        <label class="switch" title="Включить / выключить">
            <input type="checkbox" id="global-toggle">
            <span class="slider"></span>
            <span class="sr-only">Глобальный переключатель</span>
        </label>
    </header>

    <main>
        <section class="status-card" id="status-card">
            <div class="status-icon-wrap" id="status-icon" aria-hidden="true"></div>
            <h2 class="status-text" id="status-label">Защита активна</h2>
            <p class="status-desc" id="status-details">Трафик маршрутизируется согласно правилам</p>
        </section>

        <section class="control-group">
            <label for="routing-mode" class="control-label">Режим маршрутизации</label>
            <div class="select-wrapper">
                <select id="routing-mode">
                    <option value="global">🌍 Глобальный (все запросы)</option>
                    <option value="tab">📌 По контексту вкладки (изоляция)</option>
                </select>
            </div>
            <p class="mode-desc" id="mode-desc"></p>
        </section>

        <button id="open-settings" class="btn-settings">
            <span class="btn-content">
                <span class="btn-icon" aria-hidden="true">⚙️</span>
                <span>Настройки проксирования</span>
            </span>
            <span class="btn-arrow" aria-hidden="true"></span>
        </button>
    </main>

    <script src="popup.js"></script>
</body>
</html>
