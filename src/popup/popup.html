<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../global.css">
    <style>
        /* ==========================================
           THEME VARIABLES
           ========================================== */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-elevated: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0f172a;
                --bg-card: #1e293b;
                --bg-elevated: #334155;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border: #334155;
                --primary: #818cf8;
                --primary-hover: #6366f1;
            }
        }

        body.dark {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-elevated: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #818cf8;
            --primary-hover: #6366f1;
        }

        /* ==========================================
           BASE
           ========================================== */
        body {
            width: 340px;
            margin: 0;
            padding: 18px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            box-sizing: border-box;
        }

        * {
            box-sizing: border-box;
        }

        /* ==========================================
           HEADER
           ========================================== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
            border-radius: var(--radius-lg);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.25;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ==========================================
           TOGGLE SWITCH
           ========================================== */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: var(--border);
            transition: 0.25s ease;
            border-radius: 34px;
            box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.25s cubic-bezier(0.4, 0.0, 0.2, 1);
            border-radius: 50%;
            box-shadow: var(--shadow-sm);
        }

        input:checked + .slider {
            background: linear-gradient(135deg, var(--success) 0%, #34d399 100%);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        input:focus-visible + .slider {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* ==========================================
           STATUS CARD
           ========================================== */
        .status-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .status-icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            background-image: url("../../icons/icon-default.png");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
            border-radius: 50%;
            transition: background-image 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .status-icon-wrap.disable {
            background-image: url("../../icons/icon-disable.png");
        }

        .status-card.active .status-icon-wrap {
            border-color: rgba(16, 185, 129, 0.35);
            transform: scale(1.075);
        }

        .status-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 6px;
            letter-spacing: -0.01em;
        }

        .status-card.active .status-text {
            color: var(--success);
        }

        .status-card:not(.active) .status-text {
            color: var(--danger);
        }

        .status-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        /* ==========================================
           ROUTING MODE
           ========================================== */
        .control-group {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .control-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
        }

        .select-wrapper {
            position: relative;
        }

        .select-trigger {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 11px 34px 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background-color: var(--bg-elevated);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: inherit;
            line-height: 1.5;
        }

        .select-trigger:hover {
            border-color: var(--primary);
        }

        .select-trigger:focus-visible {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .select-trigger-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            color: var(--primary);
        }

        .select-trigger-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .select-wrapper::after {
            content: "";
            position: absolute;
            right: 14px;
            top: 50%;
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--text-muted);
            border-bottom: 2px solid var(--text-muted);
            pointer-events: none;
            transform: translateY(-75%) rotate(45deg);
            transition: transform 0.2s ease;
        }

        .select-wrapper.open::after {
            transform: translateY(-25%) rotate(-135deg);
        }

        .select-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 100;
            margin: 0;
            padding: 4px;
            list-style: none;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .select-wrapper.open .select-dropdown {
            display: block;
        }

        .select-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .select-option:hover {
            background-color: var(--bg-elevated);
        }

        .select-option.selected {
            background-color: var(--bg-elevated);
            color: var(--primary);
        }

        .select-option-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            color: var(--text-muted);
        }

        .select-option.selected .select-option-icon {
            color: var(--primary);
        }

        .mode-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-top: 10px;
        }

        /* ==========================================
           SETTINGS BUTTON
           ========================================== */
        .btn-settings {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 13px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: var(--radius-lg);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .btn-settings:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .btn-settings:active {
            transform: translateY(0);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background-color: var(--bg-elevated);
            font-size: 0.95rem;
        }

        .btn-arrow {
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--text-muted);
            border-top: 2px solid var(--text-muted);
            transform: rotate(45deg);
            transition: transform 0.2s ease;
        }

        .btn-settings:hover .btn-arrow {
            transform: rotate(45deg) translate(2px, -2px);
        }

        /* ==========================================
           MICRO UTILITY
           ========================================== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand">
            <!--div class="logo-icon" aria-hidden="true">🔀</div-->
            <div class="brand-text">
                <span class="title" data-i18n="extensionName">Proxy Router Manager</span>
                <span class="subtitle">Быстрый доступ к прокси</span>
            </div>
        </div>
        <label class="switch" title="Включить / выключить">
            <input type="checkbox" id="global-toggle">
            <span class="slider"></span>
            <span class="sr-only">Глобальный переключатель</span>
        </label>
    </header>

    <main>
        <section class="status-card" id="status-card">
            <div class="status-icon-wrap" id="status-icon" aria-hidden="true"></div>
            <h2 class="status-text" id="status-label">Защита активна</h2>
            <p class="status-desc" id="status-details">Трафик маршрутизируется согласно правилам</p>
        </section>

        <section class="control-group">
            <label for="routing-mode-trigger" class="control-label">Режим маршрутизации</label>
            <div class="select-wrapper" id="routing-mode-wrapper">
                <button class="select-trigger" id="routing-mode-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span class="select-trigger-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M2.5 4a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1m2-.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0m1 .5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"/>
                            <path d="M2 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm13 2v2H1V3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1M2 14a1 1 0 0 1-1-1V6h14v7a1 1 0 0 1-1 1z"/>
                        </svg>
                    </span>
                    <span class="select-trigger-text" id="routing-mode-text">Глобальный (все запросы)</span>
                </button>
                <ul class="select-dropdown" id="routing-mode-dropdown" role="listbox" aria-label="Режим маршрутизации">
                    <li role="option" data-value="global" aria-selected="true" class="select-option selected">
                        <span class="select-option-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M2.5 4a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1m2-.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0m1 .5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"/>
                                <path d="M2 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm13 2v2H1V3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1M2 14a1 1 0 0 1-1-1V6h14v7a1 1 0 0 1-1 1z"/>
                            </svg>
                        </span>
                        <span>Глобальный (все запросы)</span>
                    </li>
                    <li role="option" data-value="tab" aria-selected="false" class="select-option">
                        <span class="select-option-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5zM2.5 3a.5.5 0 0 0-.5.5V6h12v-.5a.5.5 0 0 0-.5-.5H9c-.964 0-1.71-.629-2.174-1.154C6.374 3.334 5.82 3 5.264 3zM14 7H2v5.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5z"/>
                            </svg>
                        </span>
                        <span>По контексту вкладки (изоляция)</span>
                    </li>
                </ul>
            </div>
            <p class="mode-desc" id="mode-desc"></p>
        </section>

        <button id="open-settings" class="btn-settings">
            <span class="btn-content">
                <span class="btn-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear" viewBox="0 0 16 16">
  <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492M5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0"/>
  <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115z"/>
</svg></span>
                <span>Настройки проксирования</span>
            </span>
            <span class="btn-arrow" aria-hidden="true"></span>
        </button>
    </main>

    <script src="popup.js"></script>
</body>
</html>
